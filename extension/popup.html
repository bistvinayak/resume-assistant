<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, "DM Sans", system-ui, sans-serif;
      color: #1c1917;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 img { width: 20px; height: 20px; }
    .status {
      font-size: 12px;
      color: #78716c;
      margin-bottom: 14px;
    }
    .status.ok { color: #16a34a; }
    .status.warn { color: #d97706; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #f59e0b;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #d6d3d1; cursor: not-allowed; }
    a { color: #f59e0b; }
    #result { font-size: 12px; margin-top: 10px; color: #78716c; min-height: 14px; }
    .divider { border: none; border-top: 1px solid #e7e5e4; margin: 16px 0; }
    .field-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      color: #78716c; margin-bottom: 6px;
    }
    .pw-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .pw-row input {
      flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #d6d3d1; border-radius: 6px;
      font-size: 13px; font-family: inherit;
    }
    .pw-row button {
      width: auto; padding: 8px 12px; font-size: 12px; flex-shrink: 0;
    }
    .pw-note { font-size: 10.5px; color: #a8a29e; line-height: 1.4; }
    #pwStatus { font-size: 11.5px; margin-top: 4px; min-height: 14px; }
    #pwStatus.ok { color: #16a34a; }
    #clearPwBtn {
      background: none; color: #a8a29e; font-weight: 400; padding: 4px; margin-top: 2px;
      text-decoration: underline; font-size: 11px;
    }
    #fitBtn { background: #1c1917; }
    #fitResult { font-size: 12px; margin-top: 10px; color: #78716c; }
    .fit-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
    .fit-pct { font-size: 26px; font-weight: 700; color: #1c1917; }
    .fit-label { font-size: 12px; color: #57534e; text-align: right; max-width: 150px; }
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-top: 1px solid #f5f5f4; }
    .row span:first-child { color: #78716c; }
    .row span:last-child { color: #1c1917; font-weight: 600; text-align: right; }
    .bar { height: 5px; background: #f5f5f4; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
    .bar > div { height: 100%; background: #f59e0b; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .pill.good { background: #dcfce7; color: #166534; }
    .pill.bad { background: #fee2e2; color: #991b1b; }
    .pill.meh { background: #f5f5f4; color: #57534e; }
    .conf { font-weight: 400; color: #a8a29e; font-size: 10.5px; }
    .fit-note { font-size: 10.5px; color: #a8a29e; margin-top: 6px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="" />Arjun Autofill</h1>
  <div id="status" class="status">Checking login…</div>
  <button id="fillBtn" disabled>Fill this page</button>
  <div id="result"></div>

  <hr class="divider" />

  <div class="field-label">Job fit &amp; sponsorship</div>
  <button id="fitBtn" disabled>Check this job</button>
  <div id="fitResult"></div>

  <hr class="divider" />

  <div class="field-label">Account-creation password</div>
  <div class="pw-row">
    <input type="password" id="pwInput" placeholder="Set a password to autofill" autocomplete="new-password" />
    <button id="savePwBtn">Save</button>
  </div>
  <div id="pwStatus"></div>
  <button id="clearPwBtn">Clear saved password</button>
  <p class="pw-note">Stored only in this browser (<code>chrome.storage.local</code>). Never sent to Arjun's backend, never seen by the mapping model — filled directly into password fields on the page.</p>

  <script src="popup.js"></script>
</body>
</html>
